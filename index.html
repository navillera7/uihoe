<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>표결 결과</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background:#0a0a0a; font-family:sans-serif; color:white; padding:14px; }
    #header { display:flex; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
    #title-text { font-weight:bold; font-size:15px; color:white; }
    #title-input { font-weight:bold; font-size:15px; color:white; background:#222; border:1px solid #888; border-radius:4px; padding:2px 6px; display:none; }
    #edit-title-btn, #screenshot-btn { background:#555; color:white; border:none; padding:3px 8px; cursor:pointer; border-radius:4px; font-size:11px; }
    #screenshot-btn { background: #3498db; }
    #summary { display:flex; gap:14px; margin-bottom:6px; font-size:13px; flex-wrap:wrap; align-items:center; }
    #verdict-btn { padding:3px 14px; border:none; cursor:pointer; font-weight:bold; font-size:13px; border-radius:4px; }
    svg { display:block; width:100%; height:auto; margin-bottom:4px; }
    #legend { display:flex; gap:14px; justify-content:center; margin-bottom:6px; font-size:11px; flex-wrap:wrap; }
    .ldot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:3px; vertical-align:middle; }
    .ctrl-grid { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
    .mcard { background:#1c1c1c; border:1px solid #333; border-radius:6px; padding:5px 8px; min-width:90px; text-align:center; }
    .mcard .mn { font-size:11px; margin-bottom:3px; }
    .btn-yes { background:#00aa00; color:#fff; border:none; padding:3px 7px; font-size:11px; font-weight:bold; border-radius:3px; cursor:pointer; margin:1px; }
    .btn-no  { background:#cc0000; color:#fff; border:none; padding:3px 7px; font-size:11px; font-weight:bold; border-radius:3px; cursor:pointer; margin:1px; }
    .btn-abs { background:#cc9900; color:#fff; border:none; padding:3px 7px; font-size:11px; font-weight:bold; border-radius:3px; cursor:pointer; margin:1px; }
    
    /* 스크린샷 모드 시 숨길 요소 */
    .screenshot-mode #edit-title-btn,
    .screenshot-mode .vote-btns { display: none; }
  </style>
</head>
<body id="body-main">
  <div id="header">
    <span id="title-text">타이틀 (00 발의)</span>
    <input id="title-input" type="text" value="타이틀 (00 발의)" onkeydown="titleKeyDown(event)" />
    <button id="edit-title-btn" onclick="editTitle()">제목 수정</button>
    <button id="screenshot-btn" onclick="toggleScreenshotMode()">스크린샷 모드</button>
  </div>
  <div id="summary">
    <span>재적 <b id="tc">0</b></span>
    <span>재석 <b id="pc">0</b></span>
    <span style="color:#00dd00">찬성 <b id="yc">0</b></span>
    <span style="color:#ff4444">반대 <b id="nc">0</b></span>
    <button id="verdict-btn" onclick="toggleVerdict()" style="background:lime;color:#000;">가결</button>
  </div>
  <svg id="svg" viewBox="0 0 700 400"></svg>
  <div id="legend">
    <span><span class="ldot" style="background:#555"></span>불출석</span>
    <span><span class="ldot" style="background:#00dd00"></span>찬성</span>
    <span><span class="ldot" style="background:#ff4444"></span>반대</span>
  </div>
  <div class="ctrl-grid" id="ctrl-grid"></div>

  <script>
    const members = [
      { name:'돌돔',     seats:18, baseColor:'#FFFFFF' },
      { name:'페터',     seats:15, baseColor:'#02BB71' },
      { name:'여명',     seats:7,  baseColor:'#D7003A' },
      { name:'라인란트', seats:25, baseColor:'#FFCC00' },
      { name:'피바',     seats:11, baseColor:'#E61E2B' },
      { name:'엔디미온', seats:8,  baseColor:'#2743D2' },
      { name:'브뤼메르', seats:8,  baseColor:'#003f88' },
      { name:'이나경',   seats:8,  baseColor:'#9EC828' },
      { name:'케이비',   seats:1,  baseColor:'#aa88ff' },
    ];

    const voteState = {};
    members.forEach(m => voteState[m.name] = 'none');

    const CX = 350, CY = 380;
    const ARC_START = Math.PI * 1.1;
    const ARC_END   = Math.PI * 1.9;
    const DOT_R = 10;
    const ROW_GAP = 32;
    const R_MIN = 130;

    let isScreenshotMode = false;

    function getDotColor(member) {
      const v = voteState[member.name];
      if (v === 'lime') return '#00dd00';
      if (v === 'red')  return '#ff4444';
      return '#555';
    }

    function buildSlots(totalSeats) {
      const slots = [];
      const numCols = 14;
      for (let col = 0; col < numCols; col++) {
        const frac = col / (numCols - 1);
        const angle = ARC_START + frac * (ARC_END - ARC_START);
        const seatsInCol = (col === 0 || col === 13) ? 2 : 8;
        for (let row = 0; row < seatsInCol; row++) {
          const r = R_MIN + row * ROW_GAP;
          const x = CX + r * Math.cos(angle);
          const y = CY + r * Math.sin(angle);
          slots.push({ x, y });
        }
      }
      slots.push({ x: CX, y: CY - 60 });
      return slots;
    }

    function render() {
      const svg = document.getElementById('svg');
      svg.innerHTML = '';
      const memberQueue = [];
      members.forEach(m => { for (let i = 0; i < m.seats; i++) memberQueue.push(m); });
      const slots = buildSlots(memberQueue.length);
      memberQueue.forEach((member, i) => {
        const s = slots[i];
        if (!s) return;
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', s.x.toFixed(1));
        circle.setAttribute('cy', s.y.toFixed(1));
        circle.setAttribute('r', DOT_R);
        circle.setAttribute('fill', getDotColor(member));
        circle.setAttribute('stroke', '#0a0a0a');
        circle.setAttribute('stroke-width', '1.5');
        svg.appendChild(circle);
      });
      updateCounts();
      renderControls();
    }

    function renderControls() {
      const grid = document.getElementById('ctrl-grid');
      grid.innerHTML = '';
      members.forEach(m => {
        const v = voteState[m.name];
        const statusColor = v === 'lime' ? '#00dd00' : v === 'red' ? '#ff4444' : '#cc9900';
        const statusLabel = v === 'lime' ? '찬성' : v === 'red' ? '반대' : '불출석';
        const d = document.createElement('div');
        d.className = 'mcard';
        d.innerHTML = `
          <div class="mn" style="color:${m.baseColor};font-weight:bold">${m.name}</div>
          <div class="mn" style="color:#888">${m.seats}석 <span style="color:${statusColor};font-weight:bold">${statusLabel}</span></div>
          <div class="vote-btns">
            <button class="btn-yes" onclick="vote('${m.name}','lime')">찬성</button>
            <button class="btn-no"  onclick="vote('${m.name}','red')">반대</button>
            <button class="btn-abs" onclick="vote('${m.name}','none')">불출석</button>
          </div>`;
        grid.appendChild(d);
      });
    }

    function toggleScreenshotMode() {
      isScreenshotMode = !isScreenshotMode;
      const body = document.getElementById('body-main');
      const btn = document.getElementById('screenshot-btn');
      
      if (isScreenshotMode) {
        body.classList.add('screenshot-mode');
        btn.textContent = '편집 모드로 돌아가기';
        btn.style.background = '#e67e22';
      } else {
        body.classList.remove('screenshot-mode');
        btn.textContent = '스크린샷 모드';
        btn.style.background = '#3498db';
      }
    }

    function vote(name, type) {
      voteState[name] = type;
      render();
    }

    function updateCounts() {
      let yes = 0, no = 0, total = 0;
      members.forEach(m => {
        total += m.seats;
        if (voteState[m.name] === 'lime') yes += m.seats;
        if (voteState[m.name] === 'red')  no  += m.seats;
      });
      document.getElementById('tc').textContent = total;
      document.getElementById('yc').textContent = yes;
      document.getElementById('nc').textContent = no;
      document.getElementById('pc').textContent = yes + no;
    }

    let verdictApproved = true;
    function toggleVerdict() {
      verdictApproved = !verdictApproved;
      const btn = document.getElementById('verdict-btn');
      btn.textContent = verdictApproved ? '가결' : '부결';
      btn.style.background = verdictApproved ? 'lime' : '#ff4444';
      btn.style.color = verdictApproved ? '#000' : '#fff';
    }

    function editTitle() {
      const txt = document.getElementById('title-text');
      const inp = document.getElementById('title-input');
      const btn = document.getElementById('edit-title-btn');
      if (inp.style.display === 'none' || inp.style.display === '') {
        inp.value = txt.textContent;
        inp.style.display = 'inline-block';
        txt.style.display = 'none';
        btn.textContent = '확인';
        inp.focus();
        inp.select();
      } else {
        const val = inp.value.trim();
        if (val) txt.textContent = val;
        inp.style.display = 'none';
        txt.style.display = 'inline';
        btn.textContent = '제목 수정';
      }
    }

    function titleKeyDown(e) {
      if (e.key === 'Enter') editTitle();
      if (e.key === 'Escape') {
        const inp = document.getElementById('title-input');
        const txt = document.getElementById('title-text');
        const btn = document.getElementById('edit-title-btn');
        inp.style.display = 'none';
        txt.style.display = 'inline';
        btn.textContent = '제목 수정';
      }
    }

    render();
  </script>
</body>
</html>
